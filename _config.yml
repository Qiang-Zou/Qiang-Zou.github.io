title: "Qiang Zou"
name: "Qiang Zou"
description: "Qiang Zou is a Research Professor at Zhejiang University working on geometric computing, intelligent CAD, and design and manufacturing automation."
url: "https://qiang-zou.github.io"
baseurl: ""
locale: "en-US"
timezone: "Asia/Shanghai"
repository: "Qiang-Zou/Qiang-Zou.github.io"

lab_identity:
  name: "Design and Manufacturing Automation Lab"
  line_one: "Design by the computer"
  line_two: "Manufacture in the computer"

author:
  name: "Qiang Zou"
  avatar: "/images/profile.jpeg"
  role: "Research Professor"
  affiliation: "Zhejiang University"
  lab: "State Key Lab of CAD&CG"
  email: "qiangzou@cad.zju.edu.cn"
  scholar: "https://scholar.google.com/citations?user=9FwFNqAAAAAJ&hl=en"
  orcid: "https://orcid.org/0000-0001-8892-1063"
  github: "https://github.com/Qiang-Zou"
  linkedin: "https://www.linkedin.com/in/qiang-zou"

layouts_dir: .site

navigation:
  - title: Research
    url: /research/
  - title: Teaching
    url: /teaching/
  - title: Service
    url: /services/
  - title: Code
    url: /codes/
  - title: Group
    url: /group/
  - title: 中文
    url: /about-chinese/

exclude:
  - .site
  - Gemfile
  - Gemfile.lock
  - README.md
  - Makefile
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .DS_Store

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from
whitelist:
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "content/about.md"
    values:
      layout: home
      page_class: home-page
  - scope:
      path: "content/research.md"
    values:
      page_class: research-page
  - scope:
      path: "content/code.md"
    values:
      content_class: code-page
  - scope:
      path: "content/chinese.md"
    values:
      page_class: chinese-page
