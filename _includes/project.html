<article class="project-row" id="{{ include.project.id }}">
  <a class="project-image" href="{{ include.project.image | relative_url }}" aria-label="View {{ include.project.name | escape }} figure at full size">
    <img src="{{ include.project.image | relative_url }}" alt="{{ include.project.name | escape }} research illustration" loading="lazy" decoding="async">
  </a>
  <div class="project-content">
    <h3>{{ include.project.title | default: include.project.name | escape }}</h3>
    <p>{{ include.project.description }}</p>
    <div class="resource-links"><a href="{{ include.project.code }}">Code <span aria-hidden="true">↗</span></a>{% if include.project.paper %}<a href="{{ include.project.paper }}">Paper <span aria-hidden="true">↗</span></a>{% endif %}</div>
  </div>
</article>
