<div class="lab-banner" aria-label="{{ site.lab_identity.name | escape }}">
  <div class="lab-banner-inner">
    <div class="lab-banner-copy">
      <p class="lab-banner-name">{{ site.lab_identity.name | escape }}</p>
      <p class="lab-banner-motto">{{ site.lab_identity.line_one | escape }}<br>{{ site.lab_identity.line_two | escape }}</p>
    </div>
    <img class="lab-banner-art" src="{{ '/assets/images/cad-surface.svg' | relative_url }}" alt="" width="640" height="240" aria-hidden="true">
  </div>
</div>
