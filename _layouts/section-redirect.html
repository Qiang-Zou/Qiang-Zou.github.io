<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ '/' | absolute_url }}#{{ page.home_section }}">
  <script>
    window.location.replace({{ '/' | relative_url | jsonify }} + (window.location.hash || {{ page.home_section | prepend: '#' | jsonify }}));
  </script>
  <meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}#{{ page.home_section }}">
</head>
<body><p>This section is now on the homepage. <a href="{{ '/' | relative_url }}#{{ page.home_section }}">Continue to {{ page.title | escape }}</a>.</p></body>
</html>
