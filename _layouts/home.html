---
layout: default
---
<div class="home-shell">
  <div class="home-layout">
    <aside class="home-profile" aria-label="Profile and contact">
      <img class="profile-photo" src="{{ site.author.avatar | relative_url }}" width="180" height="180" alt="Qiang Zou" fetchpriority="high">
      <div class="profile-details">
        <h2>Qiang Zou <span lang="zh-CN">邹强</span></h2>
        <p class="profile-affiliation">Mechanical Engineer +<br>Computer Scientist</p>
        <p class="profile-location">Hangzhou, China</p>
        <nav class="profile-contacts" aria-label="Academic profiles">
          <a class="profile-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
          <a href="{{ site.author.scholar }}">Google Scholar</a>
          <a href="{{ site.author.orcid }}">ORCID</a>
          <a href="{{ site.author.github }}">GitHub</a>
          <a href="{{ site.author.linkedin }}">LinkedIn</a>
        </nav>
      </div>
    </aside>
    <section class="home-content" aria-labelledby="about-title">
      <h1 id="about-title">About</h1>
      <div class="home-bio">{{ content }}</div>
    </section>
  </div>
</div>
