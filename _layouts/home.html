---
layout: default
---
<div class="home-shell">
    <aside class="sidebar sticky" aria-label="Profile and contact">
      <div itemscope itemtype="https://schema.org/Person">
        <div class="author__avatar">
          <img src="{{ site.author.avatar | relative_url }}" class="author__avatar" alt="Qiang Zou" width="400" height="400" fetchpriority="high">
        </div>
        <div class="author__content">
          <h3 class="author__name">Qiang Zou</h3>
          <p class="author__bio">Mechanical Engineer + Computer Scientist</p>
        </div>
        <div class="author__urls-wrapper">
          <button type="button" class="btn btn--inverse" aria-expanded="false" aria-controls="author-links">Follow</button>
          <ul id="author-links" class="author__urls social-icons">
            <li><i class="fas fa-fw fa-map-marker" aria-hidden="true"></i> Hangzhou, China, 310027</li>
            <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>
            <li><a href="{{ site.author.linkedin }}"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i> LinkedIn</a></li>
            <li><a href="{{ site.author.scholar }}"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>
            <li><a href="{{ site.author.orcid }}"><i class="ai ai-orcid-square ai-fw" aria-hidden="true"></i> ORCID</a></li>
            <li><a href="{{ site.author.github }}"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
          </ul>
        </div>
      </div>
    </aside>
    <article class="home-content" aria-labelledby="about-title">
      <div class="home-reading-column">
        <header class="page-heading"><h1 id="about-title">About</h1></header>
        <section class="prose home-bio">{{ content }}</section>
      </div>
    </article>
</div>
